[defaults]
inventory = inventaire.ini
host_key_checking = True
# Interpréteur fixé : plus de découverte automatique (et plus d'avertissement)
interpreter_python = /usr/bin/python3

[ssh_connection]
# Accepte l'empreinte d'un NOUVEAU serveur, refuse une empreinte qui a changé.
ssh_args = -o StrictHostKeyChecking=accept-new
