global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alertes.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # L'API : "api" = nom du service Compose (DNS interne de Docker), port interne 8000.
  - job_name: restaurant-api
    static_configs:
      - targets: ["api:8000"]
