# Les signaux d'or de l'API : disponibilité, erreurs, latence.
groups:
  - name: restaurant-api
    rules:
      - alert: APIIndisponible
        expr: up{job="restaurant-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "L'API ne répond plus au scraping depuis 1 min"

      - alert: TauxErreursEleve
        # part des réponses 5xx sur 5 min ; "or vector(0)" : 0 quand il n'y a aucune erreur
        expr: |
          (sum(rate(http_requests_total{code=~"5.."}[5m])) or vector(0))
            / sum(rate(http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value | humanizePercentage }} des requêtes finissent en erreur 5xx"

      - alert: LatenceElevee
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Latence p95 de {{ $value | humanizeDuration }} (seuil : 500 ms)"
